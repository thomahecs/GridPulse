name: GridPulse checks
on:
  push:
  pull_request:
jobs:
  tests-and-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.run_all --quick
      - name: Check generated metrics and audit exist
        run: |
          test -s reports/future_metrics.json
          test -s reports/temporal_backtest.csv
          test -s reports/resume_audit.md
